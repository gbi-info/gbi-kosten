<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GBi Kosten">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>GBi Kostenermittlung</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="screen-projekt" class="screen" data-tab="projekt"></main>
  <main id="screen-kosten" class="screen" data-tab="kosten" hidden>
    <div id="kosten-head"></div>
    <div id="cost-list"></div>
  </main>
  <main id="screen-export" class="screen" data-tab="export" hidden></main>
  <main id="screen-mehr" class="screen" data-tab="mehr" hidden></main>

  <div id="sumbar" class="sumbar" hidden></div>
  <button id="fab" class="fab" type="button" data-action="add-menu" aria-label="Hinzufügen" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav id="tabbar" class="tabbar" aria-label="Bereiche">
    <button type="button" data-tab="projekt" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span>Projekt</span>
    </button>
    <button type="button" data-tab="kosten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor"/></svg><span>Kosten</span>
    </button>
    <button type="button" data-tab="export">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M5 13v7h14v-7"/></svg><span>Export</span>
    </button>
    <button type="button" data-tab="mehr">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span>Mehr</span>
    </button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<input type="file" id="stamp-input" accept="image/png,image/jpeg" hidden>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
